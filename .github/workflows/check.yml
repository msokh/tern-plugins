name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks and luau
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sSfL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          sudo unzip -o luau.zip luau -d /usr/local/bin
      - name: Public content
        env:
          TERN_PLUGINS_DENYLIST: ${{ secrets.TERN_PLUGINS_DENYLIST }}
        run: scripts/check-public.sh history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Automations tests
        run: |
          luau plugins/automations/tests/run.luau
          luau plugins/automations/tests/ui.luau
          node --test plugins/automations/tests/receiver.test.mjs plugins/automations/tests/styles.test.mjs
